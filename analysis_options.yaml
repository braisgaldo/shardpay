# Configuración del analizador.
#
# La base es `flutter_lints`, con reglas añadidas que atacan problemas que este
# proyecto ya ha tenido: `BuildContext` usado después de un `await`, `await`
# olvidados en escrituras, y objetos reconstruidos dentro de bucles.
#
# Las severidades se dejan en sus valores por defecto a propósito. Convertir
# `use_build_context_synchronously` o `unawaited_futures` en errores es el
# objetivo, pero hay que hacerlo **después** de limpiar lo que ya haya, no
# antes: un análisis que falla el primer día se acaba ignorando. Está anotado
# como deuda en docs/MANUAL-TECNICO.md.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Los TODO no ensucian la salida del análisis.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**

linter:
  rules:
    # --- Corrección ---------------------------------------------------------
    # Estas son las que encuentran fallos de verdad.
    - avoid_empty_else
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps

    # --- Rendimiento --------------------------------------------------------
    # Casi todo lo que se ganó en esta entrega viene de dejar de reconstruir
    # cosas que no cambian. Estas reglas empujan en la misma dirección.
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - use_string_buffers

    # --- Legibilidad --------------------------------------------------------
    - avoid_returning_null_for_void
    - directives_ordering
    - noop_primitive_operations
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - use_full_hex_values_for_flutter_colors
    - use_named_constants

    # --- Documentación ------------------------------------------------------
    - slash_for_doc_comments
